Super+2, Switch to workspace 2, workspace 2
Super+3, Switch to workspace 3, workspace 3
Super+4, Switch to workspace 4, workspace 4
Super+5, Switch to workspace 5, workspace 5
Super+6, Switch to workspace 6, workspace 6
Super+7, Switch to workspace 7, workspace 7
Super+8, Switch to workspace 8, workspace 8
Super+9, Switch to workspace 9, workspace 9
Super+Shift+1, Move window to workspace 1, move-to-workspace 1
Super+Shift+2, Move window to workspace 2, move-to-workspace 2
Super+Shift+3, Move window to workspace 3, move-to-workspace 3
Super+Shift+4, Move window to workspace 4, move-to-workspace 4
Super+Shift+5, Move window to workspace 5, move-to-workspace 5
Super+Shift+6, Move window to workspace 6, move-to-workspace 6
Super+Shift+7, Move window to workspace 7, move-to-workspace 7
Super+Shift+8, Move window to workspace 8, move-to-workspace 8
Super+Shift+9, Move window to workspace 9, move-to-workspace 9
Super+Tab, Next workspace, next-desktop
Super+Shift+Tab, Previous workspace, previous-desktop
Super+Ctrl+Tab, Former workspace, former-desktop
Super+S, Toggle scratchpad, action toggle-scratchpad
Super+Alt+S, Move window to scratchpad, action assign-scratchpad

