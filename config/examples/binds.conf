# Groups: grouped windows share one tile and show one at a time
Super+G, Toggle window grouping, toggle-group
Super+Alt+G, Move window out of group, leave-group
Super+Alt+Left, Move window into group on the left, move-into-group-left
Super+Alt+Right, Move window into group on the right, move-into-group-right
Super+Alt+Up, Move window into group above, move-into-group-up
Super+Alt+Down, Move window into group below, move-into-group-down
Super+Alt+Tab, Next window in group, next-in-group
