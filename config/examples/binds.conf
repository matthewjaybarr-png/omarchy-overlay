Super+Alt+2, Show window 2 of the group, group-window-2
Super+Alt+3, Show window 3 of the group, group-window-3
Super+Alt+4, Show window 4 of the group, group-window-4
Super+Alt+5, Show window 5 of the group, group-window-5

