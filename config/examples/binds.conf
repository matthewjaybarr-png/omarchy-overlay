# Omarchy Overlay keybinds. One keybind per line:
#   key, description, command
# Super is the Windows key. Lines starting with # are notes.
# The defaults follow stock Omarchy where Windows allows it. Super+L and Ctrl+Alt+Delete always
# stay with Windows; plain Alt keys are allowed but warned about, since many programs use them.
# Commands are listed in README under "Config files". After editing, choose
# Menu > Update > Config > Reload config files, or restart Omarchy Overlay.

# Launching
Super+Space, Omarchy menu, menu
Super+Alt+Space, Apps, apps
Super+Escape, System menu, menu system
Super+K, Keybindings, keybinds
Super+Return, Terminal, app terminal
Super+Shift+B, Browser, app browser
Super+Shift+Return, Browser, app browser
Super+Alt+Shift+B, Browser (private), app browser-private
Super+Shift+F, File manager, app files
# The laptop's "File manager (cwd)" has no Windows meaning; it opens File Explorer itself.
Super+Alt+Shift+F, File Explorer, app explorer
Super+Shift+E, Email, app email
Super+Alt+Shift+E, New email, app new-email
Super+Shift+C, Calendar, app calendar
Super+Shift+N, Editor, app editor
Super+Shift+Q, Calculator, app calculator
Super+Shift+M, Music, app music
Super+Shift+T, Activity, app activity
# Omarchy's web apps. Signal has no web app, so Super+Shift+G opens WhatsApp.
Super+Shift+A, ChatGPT, webapp ChatGPT
Super+Shift+Alt+A, Grok, webapp Grok
Super+Shift+G, WhatsApp, webapp WhatsApp
Super+Shift+Alt+G, WhatsApp, webapp WhatsApp
Super+Shift+Y, YouTube, webapp YouTube
Super+Shift+P, Google Photos, webapp Google Photos
Super+Shift+S, Google Maps, webapp Google Maps
Super+Shift+X, X, webapp X
Super+Shift+Alt+X, X Post, webapp X Post

# Universal clipboard: sends Ctrl+C/V/X/A once Super is released
# (Ctrl+Shift+C/V in Windows Terminal).
Super+C, Universal copy, copy
Super+V, Universal paste, paste
Super+X, Universal cut, cut
Super+A, Select all, select-all

# Windows
Super+W, Close window, action close-window
Super+Q, Close window, action close-window
Super+M, Minimize window, minimize-window
Super+T, Toggle window floating/tiling, action float
Super+F, Full screen, action maximize-window
Super+Alt+F, Full width, action maximize-window
Super+J, Toggle window split, action flip-split
Super+Left, Focus on left window, action focus-left-arrow
Super+Right, Focus on right window, action focus-right-arrow
Super+Up, Focus on above window, action focus-up-arrow
Super+Down, Focus on below window, action focus-down-arrow
Super+Shift+Left, Swap window to the left, action swap-left-arrow
Super+Shift+Right, Swap window to the right, action swap-right-arrow
Super+Shift+Up, Swap window up, action swap-up-arrow
Super+Shift+Down, Swap window down, action swap-down-arrow
Super+Ctrl+Shift+Left, Move window to left monitor, action move-monitor-left
Super+Ctrl+Shift+Right, Move window to right monitor, action move-monitor-right
Super+Ctrl+Shift+Up, Move window to up monitor, action move-monitor-up
Super+Ctrl+Shift+Down, Move window to down monitor, action move-monitor-down
# Super+Minus and Super+Equal stay with Windows Magnifier. To use them for
# resizing instead, remove the # in front of these lines:
# Super+Minus, Shrink window, action resize-narrower
# Super+Equal, Grow window, action resize-wider
Super+Backspace, Toggle transparency on a window, action opacity-90
Super+Shift+Backspace, Toggle window gaps, page gaps
Super+Shift+L, Cycle workspace layout, action cycle-layout
# Fixed opacity on the selected window. Off by default; remove the # to use them:
# Super+Alt+T, Toggle 85% opacity, action opacity-85
# Super+Alt+R, Toggle 90% opacity, action opacity-90
# Super+Alt+Y, Toggle 95% opacity, action opacity-95
# Super+Alt+U, Toggle 98% opacity, action opacity-98

