name: Release

# A v* tag builds both release zips and makes a draft GitHub release from them.
# Run it by hand (Actions > Release > Run workflow) to build the zips without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Omarchy release whose stock theme backgrounds go into both zips.
  OMARCHY_VERSION: v4.5.0

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the Windows toolchain
        run: |
          rustup target add x86_64-pc-windows-msvc
          sudo apt-get update
          sudo apt-get install -y clang lld llvm imagemagick
          # Ubuntu's ImageMagick 6 has no `magick` command; package.py only converts with it.
          printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
          sudo chmod +x /usr/local/bin/magick
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - name: Keep testing notes out of releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -e docs/testing ]; then
            echo "docs/testing is for work branches only. Remove it before tagging a release." >&2
            exit 1
          fi
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Unit tests
        run: cargo test
      - name: Build
        run: cargo xwin build --release --target x86_64-pc-windows-msvc
      - name: Get the Omarchy themes
        run: |
          git clone --quiet --depth 1 --branch "$OMARCHY_VERSION" https://github.com/basecamp/omarchy "$RUNNER_TEMP/omarchy"
          sudo mkdir -p /usr/share/omarchy
          sudo cp -r "$RUNNER_TEMP/omarchy/themes" /usr/share/omarchy/
      # Code signing (SignPath) goes here, once the project is accepted.
      - name: Package
        run: |
          python3 scripts/package.py --selftest
          python3 scripts/package.py
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no ## $version section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Omarchy Overlay $version" --notes-file notes.md \
            dist/*.zip dist/SHA256SUMS.txt
