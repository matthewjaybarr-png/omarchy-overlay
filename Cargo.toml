[package]
name = "omarchy-overlay"
version = "0.1.0"
edition = "2021"
description = "Portable keyboard-first window management for Windows 11"
license = "MIT"

[[bin]]
name = "OmarchyOverlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", default-features = false, features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_Com", "Win32_System_Registry", "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security",
  "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
